<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Admin | ACM CTF 3.0</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/registration.css"><style>.admin-grid{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:24px}.admin-panel{border:1px solid #18324a;background:#081321;padding:22px}.admin-form{display:grid;gap:13px}.admin-form label{font:11px "JetBrains Mono";color:#8da2b8}.admin-form input,.admin-form select,.admin-form textarea{width:100%;margin-top:5px;padding:11px;background:#030814;border:1px solid #18324a;color:#effaff}.admin-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #18324a}.admin-row button{background:none;border:1px solid #ff3c5f;color:#ff6680}.warning{border-color:#ffc857;color:#ffc857}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}}</style></head><body><main class="section"><div class="wrap"><p class="eyebrow">ADMIN CONSOLE</p><h2>Team management</h2><p class="notice warning">Local admin workspace: export the JSON and commit it to <code>data/teams.json</code> to publish changes. Do not put a CTFd token in this page.</p><div class="admin-grid"><section class="admin-panel"><form id="team-form" class="admin-form"><input type="hidden" name="id"><label>Team name<input name="name" required></label><label>Status<select name="status"><option>pending</option><option>approved</option><option>rejected</option></select></label><label>Experience<select name="experience"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>Members — one per line<textarea name="members" rows="6" required></textarea></label><label>Score<input name="score" type="number" min="0" value="0"></label><label>Rank<input name="rank" type="number" min="1"></label><button class="btn" type="submit">Save team</button></form></section><section class="admin-panel"><div class="actions" style="justify-content:flex-start;margin:0 0 16px"><button class="btn ghost" id="export" type="button">Export JSON</button><label class="btn ghost">Import JSON<input id="import" type="file" accept="application/json" hidden></label></div><div id="admin-list"></div></section></div></div></main><script src="assets/teams.js"></script><script src="assets/interactions.js"></script><script src="assets/admin.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams | ACM CTF 3.0</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/registration.css"><style>.team-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.team-card{border:1px solid #18324a;background:#081321;padding:22px;text-decoration:none;color:#effaff;transition:.2s}.team-card:hover{border-color:#00f0ff;transform:translateY(-3px)}.team-card h3{margin:.5rem 0}.team-meta{display:flex;justify-content:space-between;color:#8da2b8;font:12px "JetBrains Mono"}.status{color:#44ff9a}.empty{border:1px dashed #18324a;padding:40px;text-align:center;color:#8da2b8}</style></head><body><main class="section"><div class="wrap"><p class="eyebrow">TEAM REGISTRY</p><div class="section-head"><div><h2>All registered teams</h2><p class="lead">Select a team to open its individual dossier.</p></div><a class="btn" href="index.html#register">Register team</a></div><div id="team-list" class="team-list"></div></div></main><script src="assets/teams.js"></script><script src="assets/interactions.js"></script><script>TeamStore.loadTeams().then(teams=>{const root=document.querySelector('#team-list');const visible=teams.filter(t=>t.status!=='rejected');root.innerHTML=visible.length?visible.map(t=>`<a class="team-card" href="team.html?team=${encodeURIComponent(t.id)}"><div class="team-meta"><span>TEAM // ${String(t.rank||'--').padStart(2,'0')}</span><span class="status">${(t.status||'pending').toUpperCase()}</span></div><h3>${t.name}</h3><div class="team-meta"><span>${t.members?.length||0} MEMBERS</span><span>${Number(t.score||0).toLocaleString()} PTS</span></div></a>`).join(''):'<div class="empty">NO TEAM RECORDS FOUND</div>'})</script></body></html>
